# .agent-policy.yml — machine-readable agent write-permission tiers for assethub-spark.
#
# This is the tool-agnostic mirror of CONSTITUTION.md for agent write permissions.
# Per-tool agent hooks (Claude Code, Cursor, Copilot, etc.) read THIS file and enforce
# the mirrored tiers. It governs ONLY agent-specific write gating — universal rules
# (secrets, CI checks) are enforced for everyone by .gitignore and GitHub Actions.
#
# Tiers:
#   protected  → an agent must NEVER write these (hard block). Human-only.
#   supervised → an agent MAY edit + open a PR, but a human must approve before merge.
#   autonomous → everything not listed (agent works alone).
# Patterns are gitignore/glob style, matched against the repo-relative path.

version: 1

protected:
  # Auth implementation — a bug here is a silent security breach
  - "cloudflare/src/auth.js"           # OIDC login/callback/logout + nonce validation
  - "cloudflare/src/user.js"           # Role and permission resolution → session JWT claims

  # Credentials and local secrets
  - "secret.env"
  - ".env"
  - ".dev.vars"
  - ".secrets"
  - "**/*.pem"
  - "**/*.p12"

  # The guardrails themselves — an agent must not weaken its own controls
  - ".agent-policy.yml"                # this file
  - "INVARIANTS.md"
  - "CONSTITUTION.md"
  - "SECURITY.md"

supervised:
  # Cloudflare Worker routing — middleware chain order is security-critical
  - "cloudflare/src/index.js"

  # AuthZ filter injection — removing filters leaks restricted assets
  - "cloudflare/src/origin/dm.js"

  # Static tenant config (Entra tenant ID, AEM env ID, IMS endpoints)
  - "cloudflare/src/config.js"

  # Worker routing, KV/D1/Analytics bindings, Secrets Store references
  - "cloudflare/wrangler.jsonc"
  - "cloudflare/package.json"

  # Page load pipeline — EAGER/LAZY/DELAYED, auth gate, role check; change affects every page
  - "scripts/scripts.js"

  # CI/CD pipelines and repo ownership
  - ".github/workflows/**"
  - ".github/CODEOWNERS"

  # Root package — dep changes affect both root and postinstall (cloudflare/)
  - "package.json"

# autonomous: everything else
# This includes: blocks/**, scripts/** (except scripts.js), shared/**,
# tests/**, styles/**, docs/**, *.html, *.css, *.md (except governance files above)
