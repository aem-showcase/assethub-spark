name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    # single npm ci installs both trees (root postinstall recurses into cloudflare/)
    - run: npm ci
    - run: npm test
    - run: npm run lint
    - run: npm test
      working-directory: cloudflare
    - run: npm run lint-ci
      working-directory: cloudflare

  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: cloudflare
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Setup deployment
      id: setup
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        # Sanitize branch name like EDS, see @adobe/helix-shared sanitizeName()
        ref=$(node -e 'process.stdout.write((process.argv[1] ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""))' -- "$HEAD_REF")
        sha="${{ github.event.pull_request.head.sha }}"
        git fetch --depth=1 origin "$sha"
        tag="git:${sha::7}"
        subject="$(git log -1 --pretty='%s' "$sha")"
        message="$(echo "${{ github.actor }}: $subject" | cut -c1-100)"
        # Derive the Helix origin from the repo being built. Use the branch
        # origin only when it can serve the login page; standalone sync
        # branches often have Worker code but no matching AEM content branch.
        helix_owner="${{ github.repository_owner }}"
        helix_repo="${{ github.event.repository.name }}"
        branch_origin="https://${ref}--${helix_repo}--${helix_owner}.aem.page"
        main_origin="https://main--${helix_repo}--${helix_owner}.aem.page"
        if curl -fsSI --max-time 10 "$branch_origin/login" >/dev/null; then
          helix_origin="$branch_origin"
        else
          echo "::warning::AEM branch login page is unavailable: $branch_origin/login; using $main_origin"
          helix_origin="$main_origin"
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "url=https://${ref}.dev.frescopamedia.com" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "message=$message" >> "$GITHUB_OUTPUT"
        echo "helix-origin=$helix_origin" >> "$GITHUB_OUTPUT"

    - run: npm ci

    - name: Create GitHub deployment
      uses: chrnorm/deployment-action@v2
      id: deployment
      with:
        token: '${{ github.token }}'
        environment: 'Cloudflare: ${{ steps.setup.outputs.ref }}'

    - name: Pin branch worker route to its zone
      # The `dev.frescopamedia.com` zone has Cloudflare for SaaS (Custom Hostnames)
      # enabled, which makes the Workers Routes API reject a bare pattern-only route
      # (error 10082: "When using wildcard host ssl for saas entitlement you must
      # specify the zone per route using zone_id or zone_name"). `wrangler deploy
      # --route <pattern>` has no CLI flag to attach a zone, so the per-PR route is
      # written into env.branch.routes in wrangler.jsonc instead, alongside the
      # explicit zone_name production already uses below.
      working-directory: cloudflare
      run: |
        node -e '
          const fs = require("fs");
          const path = "wrangler.jsonc";
          const pattern = "${{ steps.setup.outputs.ref }}.dev.frescopamedia.com/*";
          let text = fs.readFileSync(path, "utf8");
          const anchor = "\"branch\": {";
          const idx = text.indexOf(anchor);
          if (idx === -1) throw new Error("env.branch block not found in wrangler.jsonc");
          const insertAt = idx + anchor.length;
          const routesBlock = `\n      "routes": [{ "pattern": ${JSON.stringify(pattern)}, "zone_name": "frescopamedia.com" }],`;
          text = text.slice(0, insertAt) + routesBlock + text.slice(insertAt);
          fs.writeFileSync(path, text);
        '

    - name: Deploy branch worker
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        workingDirectory: cloudflare
        command: >-
          deploy --env branch
          --name "spark-eds-pr-${{ github.event.pull_request.number }}"
          --var "HELIX_ORIGIN:${{ steps.setup.outputs.helix-origin }}"
          --tag "${{ steps.setup.outputs.tag }}"
          --message "${{ steps.setup.outputs.message }}"

    - name: Update deployment status (success)
      if: success()
      uses: chrnorm/deployment-status@v2
      with:
        token: '${{ github.token }}'
        deployment-id: ${{ steps.deployment.outputs.deployment_id }}
        environment-url: '${{ steps.setup.outputs.url }}'
        state: 'success'

    - name: Update deployment status (failure)
      if: failure()
      uses: chrnorm/deployment-status@v2
      with:
        token: '${{ github.token }}'
        deployment-id: ${{ steps.deployment.outputs.deployment_id }}
        state: 'failure'

  undeploy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci

    - name: Delete branch worker
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        workingDirectory: cloudflare
        command: delete --name "spark-eds-pr-${{ github.event.pull_request.number }}" --force
